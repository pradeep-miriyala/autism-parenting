<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Little Steps</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --bg: #F5F2EC; --ink: #16130F; --ink-50: #6D6357;
    --accent: #2E3A6B; --line: rgba(22,19,15,0.15); --surface: #FBF9F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif; line-height: 1.7;
    min-height: 100svh; display: grid; place-items: center;
    padding: 2rem 1.25rem;
  }
  main { max-width: 32rem; text-align: left; }
  img { width: 64px; height: 64px; border-radius: 12px; display: block; margin-bottom: 1.75rem; }
  .eyebrow {
    font-weight: 600; font-size: 0.66rem; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 0.8rem;
  }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.6rem);
       line-height: 1.08; letter-spacing: -0.015em; margin-bottom: 0.9rem; }
  p { color: var(--ink-50); font-size: 1rem; max-width: 46ch; }
  button {
    margin-top: 2rem; font: inherit; font-weight: 700;
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    padding: 0.85rem 1.6rem; cursor: pointer; min-height: 44px;
  }
  button:hover { opacity: 0.85; }
  .note {
    margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--ink-50);
  }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="64" height="64">
    <span class="eyebrow">Little Steps</span>
    <h1>No connection right now.</h1>
    <p>The games need a moment of connection the first time they are opened.
       Once opened, they keep working without one.</p>
    <button type="button" onclick="location.replace('/')">Try again</button>
    <p class="note">This page will retry on its own the moment the device is back online.</p>
  </main>
  <script>
    addEventListener('online', function () { location.replace('/') })
  </script>
</body>
</html>
